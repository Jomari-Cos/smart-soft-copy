services:
  - type: web
    name: smart-soft-copy
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromService:
          name: smart-soft-copy-db
          property: connectionString

databases:
  - name: smart-soft-copy-db
    databaseName: smart_soft_copy
    user: smart_soft_copy_user
    plan: starter