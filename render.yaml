services:
  - type: web
    name: smart-soft-copy
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: smart-soft-copy-db
    databaseName: smart_soft_copy
    user: smart_soft_copy_user
    plan: starter